name: Inspecionar schema do Portal (somente leitura)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pymssql==2.3.2'
      - name: Consultar somente nomes e tipos de colunas
        env:
          SQLSERVER_HOST: ${{ secrets.SQLSERVER_HOST }}
          SQLSERVER_DB: ${{ secrets.SQLSERVER_DB }}
          SQLSERVER_USER: ${{ secrets.SQLSERVER_USER }}
          SQLSERVER_PASSWORD: ${{ secrets.SQLSERVER_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import pymssql
          with pymssql.connect(server=os.environ['SQLSERVER_HOST'], user=os.environ['SQLSERVER_USER'], password=os.environ['SQLSERVER_PASSWORD'], database=os.environ['SQLSERVER_DB'], login_timeout=30, timeout=60) as conn:
              cur = conn.cursor()
              cur.execute("SELECT TABLE_NAME, COLUMN_NAME, DATA_TYPE FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA = 'dbo' AND (TABLE_NAME LIKE '%Empreendimento%' OR TABLE_NAME LIKE '%Protocolo%' OR TABLE_NAME LIKE '%Aprov%') ORDER BY TABLE_NAME, ORDINAL_POSITION")
              for table, column, kind in cur.fetchall():
                  print(f'{table}\t{column}\t{kind}')
          PY
