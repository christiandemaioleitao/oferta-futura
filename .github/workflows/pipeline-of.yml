name: Pipeline Oferta Futura

on:
  workflow_dispatch:
    inputs:
      data_base:
        description: "Data base (mm/aaaa) - a janela e a projeção vão daqui até +18 meses"
        default: "01/2026"
      fator_ajuste:
        description: "Fator multiplicador da curva"
        default: "1.0"
      ignorar_queda:
        description: "Publicar mesmo com queda >10% de empreendimentos (use ao estreitar a janela de propósito)"
        type: boolean
        default: false
  schedule:
    # Todo dia 30 às 06:00 de Brasília (09:00 UTC); fevereiro não tem dia 30 — rodar manualmente se precisar
    - cron: "0 9 30 * *"

permissions:
  contents: write

concurrency:
  group: pipeline-of
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # versões fixas: o tratamento de nulos do pipeline muda de comportamento entre releases do pandas
      - name: Instalar dependências
        run: pip install "pandas==2.3.1" "numpy==2.3.1" "pymssql==2.3.2" "psycopg2-binary==2.9.12"

      - name: Rodar pipeline
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SQLSERVER_HOST: ${{ secrets.SQLSERVER_HOST }}
          SQLSERVER_DB: ${{ secrets.SQLSERVER_DB }}
          SQLSERVER_USER: ${{ secrets.SQLSERVER_USER }}
          SQLSERVER_PASSWORD: ${{ secrets.SQLSERVER_PASSWORD }}
          OF_DATA_BASE: ${{ github.event.inputs.data_base || '01/2026' }}
          FATOR_AJUSTE: ${{ github.event.inputs.fator_ajuste || '1.0' }}
          # escape da guarda de sanidade; o agendamento nunca ignora a queda
          OF_IGNORAR_QUEDA: ${{ github.event.inputs.ignorar_queda == 'true' && '1' || '0' }}
        run: python scripts/pipeline_of.py

      - name: Commitar dados atualizados
        run: |
          # autor = dono da conta Vercel, senão o deploy automático é bloqueado (Hobby)
          git config user.name "Christian Leitao"
          git config user.email "christiandemaio80@gmail.com"
          git add data/dados_of.js data/mapa_of.js index.html
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "chore: atualiza dados do dashboard via pipeline"
            # o push disputa o main com commits manuais. Um rebase só não basta: entre o
            # rebase e o push cabe outro commit, e o step morre com "fetch first".
            for tentativa in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "dados publicados na tentativa $tentativa"
                exit 0
              fi
              echo "push rejeitado (tentativa $tentativa), rebaseando de novo em 10s"
              sleep 10
            done
            echo "não consegui publicar os dados após 5 tentativas" >&2
            exit 1
          fi
